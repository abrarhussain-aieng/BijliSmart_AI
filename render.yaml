services:
  - type: web
    name: bijlismart-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./data/chroma
