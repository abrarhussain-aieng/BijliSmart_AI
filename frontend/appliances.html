<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BijliSmartAI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="appliances.html" data-title="Appliances" data-sub="Estimate which appliances use the most electricity">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div id="content">
      <div class="card">
        <h2>Add an appliance</h2>
        <div class="form" id="appliance-form">
          <label>Appliance<input id="a-name" placeholder="AC (1.5 ton)" maxlength="80"></label>
          <label>Power (watts)<input id="a-watts" type="number" min="1" max="20000" placeholder="1500"></label>
          <label>Quantity<input id="a-qty" type="number" min="1" max="100" value="1"></label>
          <label>Hours per day<input id="a-hours" type="number" min="0" max="24" step="0.5" placeholder="8"></label>
          <label>Days per month<input id="a-days" type="number" min="1" max="31" value="30"></label>
          <button class="btn" id="a-add" type="button">Add</button>
        </div>
        <div id="form-msg"></div>
      </div>
      <div class="grid two-b" style="margin-top:18px">
        <div class="card"><h2>Estimated usage</h2><div id="appliance-table"></div></div>
        <div class="card"><h2>Share of estimated usage</h2><div id="appliance-donut"></div></div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
<script src="js/appliances.js"></script>
</body>
</html>
